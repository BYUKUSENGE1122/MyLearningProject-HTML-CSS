<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spanish Vocabulary — Colors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ColorVocabulary.css" />
  </head>
  <body>
    <header>
      <p class="eyebrow">Learning CSS Through Color</p>
      <h1>Color Vocabulary</h1>
      <h2>Learn the names of colors in Spanish, one by one</h2>
    </header>

    <main>
      <div class="swatch-grid">
        <figure class="swatch-card">
          <div class="color" id="red" style="background-color: #e63946"></div>
          <figcaption>
            <h3 class="color-title">Rojo</h3>
            <p class="color-code">CV&nbsp;·&nbsp;001</p>
            <p class="color-desc">
              The color of strawberries, roses, and hearts. Spanish for
              <em>red</em>.
            </p>
          </figcaption>
        </figure>

        <figure class="swatch-card">
          <div class="color" id="blue" style="background-color: #1d3557"></div>
          <figcaption>
            <h3 class="color-title">Azul</h3>
            <p class="color-code">CV&nbsp;·&nbsp;002</p>
            <p class="color-desc">
              The color of a clear sky and the deep ocean. Spanish for
              <em>blue</em>.
            </p>
          </figcaption>
        </figure>

        <figure class="swatch-card">
          <div class="color" id="green" style="background-color: #588157"></div>
          <figcaption>
            <h3 class="color-title">Verde</h3>
            <p class="color-code">CV&nbsp;·&nbsp;003</p>
            <p class="color-desc">
              The color of leaves, forests, and springtime. Spanish for
              <em>green</em>.
            </p>
          </figcaption>
        </figure>

        <figure class="swatch-card">
          <div
            class="color"
            id="yellow"
            style="background-color: #f2b705"
          ></div>
          <figcaption>
            <h3 class="color-title">Amarillo</h3>
            <p class="color-code">CV&nbsp;·&nbsp;004</p>
            <p class="color-desc">
              The color of the sun, sunflowers, and lemons. Spanish for
              <em>yellow</em>.
            </p>
          </figcaption>
        </figure>

        <figure class="swatch-card">
          <div
            class="color"
            id="orange"
            style="background-color: #f3722c"
          ></div>
          <figcaption>
            <h3 class="color-title">Naranja</h3>
            <p class="color-code">CV&nbsp;·&nbsp;005</p>
            <p class="color-desc">
              The color of ripe oranges and a sunset sky. Spanish for
              <em>orange</em>.
            </p>
          </figcaption>
        </figure>

        <figure class="swatch-card">
          <div
            class="color"
            id="purple"
            style="background-color: #6a4c93"
          ></div>
          <figcaption>
            <h3 class="color-title">Morado</h3>
            <p class="color-code">CV&nbsp;·&nbsp;006</p>
            <p class="color-desc">
              The color of grapes, lavender, and plums. Spanish for
              <em>purple</em>.
            </p>
          </figcaption>
        </figure>

        <figure class="swatch-card">
          <div class="color" id="pink" style="background-color: #f4a6c6"></div>
          <figcaption>
            <h3 class="color-title">Rosa</h3>
            <p class="color-code">CV&nbsp;·&nbsp;007</p>
            <p class="color-desc">
              The color of cherry blossoms and bubblegum. Spanish for
              <em>pink</em>.
            </p>
          </figcaption>
        </figure>

        <figure class="swatch-card">
          <div class="color" id="brown" style="background-color: #6f4e37"></div>
          <figcaption>
            <h3 class="color-title">Marrón</h3>
            <p class="color-code">CV&nbsp;·&nbsp;008</p>
            <p class="color-desc">
              The color of tree bark, coffee, and soil. Spanish for
              <em>brown</em>.
            </p>
          </figcaption>
        </figure>

        <figure class="swatch-card">
          <div class="color" id="black" style="background-color: #1c1c1c"></div>
          <figcaption>
            <h3 class="color-title">Negro</h3>
            <p class="color-code">CV&nbsp;·&nbsp;009</p>
            <p class="color-desc">
              The color of a moonless night and fresh asphalt. Spanish for
              <em>black</em>.
            </p>
          </figcaption>
        </figure>

        <figure class="swatch-card swatch-card--outline">
          <div class="color" id="white" style="background-color: #f7f6f2"></div>
          <figcaption>
            <h3 class="color-title">Blanco</h3>
            <p class="color-code">CV&nbsp;·&nbsp;010</p>
            <p class="color-desc">
              The color of fresh snow and clean paper. Spanish for
              <em>white</em>.
            </p>
          </figcaption>
        </figure>

        <figure class="swatch-card">
          <div class="color" id="gray" style="background-color: #9b9b93"></div>
          <figcaption>
            <h3 class="color-title">Gris</h3>
            <p class="color-code">CV&nbsp;·&nbsp;011</p>
            <p class="color-desc">
              The color of storm clouds and river stones. Spanish for
              <em>gray</em>.
            </p>
          </figcaption>
        </figure>

        <figure class="swatch-card">
          <div
            class="color"
            id="turquoise"
            style="background-color: #2ec4b6"
          ></div>
          <figcaption>
            <h3 class="color-title">Turquesa</h3>
            <p class="color-code">CV&nbsp;·&nbsp;012</p>
            <p class="color-desc">
              The color of tropical shallows and sea glass. Spanish for
              <em>turquoise</em>.
            </p>
          </figcaption>
        </figure>

        <figure class="swatch-card">
          <div
            class="color"
            id="violet"
            style="background-color: #7b2cbf"
          ></div>
          <figcaption>
            <h3 class="color-title">Violeta</h3>
            <p class="color-code">CV&nbsp;·&nbsp;013</p>
            <p class="color-desc">
              The color of violets and a fading dusk sky. Spanish for
              <em>violet</em>.
            </p>
          </figcaption>
        </figure>

        <figure class="swatch-card">
          <div class="color" id="beige" style="background-color: #d8c3a5"></div>
          <figcaption>
            <h3 class="color-title">Beige</h3>
            <p class="color-code">CV&nbsp;·&nbsp;014</p>
            <p class="color-desc">
              The color of sand dunes and linen fabric. Spanish for
              <em>beige</em>.
            </p>
          </figcaption>
        </figure>

        <figure class="swatch-card">
          <div class="color" id="gold" style="background-color: #c9a227"></div>
          <figcaption>
            <h3 class="color-title">Dorado</h3>
            <p class="color-code">CV&nbsp;·&nbsp;015</p>
            <p class="color-desc">
              The color of sunlight and wedding rings. Spanish for
              <em>gold</em>.
            </p>
          </figcaption>
        </figure>

        <figure class="swatch-card">
          <div
            class="color"
            id="silver"
            style="background-color: #b0b0b0"
          ></div>
          <figcaption>
            <h3 class="color-title">Plateado</h3>
            <p class="color-code">CV&nbsp;·&nbsp;016</p>
            <p class="color-desc">
              The color of coins, moonlight, and steel. Spanish for
              <em>silver</em>.
            </p>
          </figcaption>
        </figure>
      </div>
      <hr />
      <section class="cta">
        <h2 class="cta-title">Are you ready to study Spanish?</h2>
        <p class="cta-sub">Sixteen colors down. Keep the streak going.</p>
        <div class="cta-actions">
          <button class="btn btn--primary">Start lesson</button>
          <button class="btn btn--outline">Skip for now</button>
          <button class="btn btn--ghost">
            Subscribe on Satto As Developer
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
